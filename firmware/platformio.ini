[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -I include
  -D LV_CONF_INCLUDE_SIMPLE
  ; --- CYD display: ILI9341_2 variant (the plain ILI9341_DRIVER init leaves
  ; --- these panels white/garbled), on HSPI (SCK 14 / MOSI 13 / MISO 12 / CS 15 / DC 2).
  ; --- Verified against the working TouchTest project settings.
  -D USER_SETUP_LOADED
  -D ILI9341_2_DRIVER
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D USE_HSPI_PORT
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@8.3.11
